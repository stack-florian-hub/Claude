<title>Radar Domaine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : en-tête ardoise fin, onglets défilants, contenu en grille fluide ; fiche bien en panneau latéral (plein écran sur mobile). */
:root {
  --bg: #F1F2EE; --surface: #FFFFFF; --sunk: #E8EAE5; --ink: #1F2A33; --muted: #5B6770; --line: #D6DAD4;
  --accent: #2C5E58; --accent-ink: #FFFFFF; --accent-soft: #DCE9E5; --gold: #9A7631; --gold-soft: #F1E8D6;
  --lvA: #2E7A4E; --lvB: #2B6688; --lvC: #A86E12; --lvD: #848C92;
  --ok: #2E7A4E; --warn: #B8730B; --bad: #B03838; --grey: #848C92;
  --iso45: rgba(44,94,88,.16); --iso55: rgba(44,94,88,.05); --commune: #C9CEC8; --map-bg: #F7F8F5;
  --f-display: "Marcellus", "Cormorant", Georgia, serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171C; --surface: #182027; --sunk: #0D1216; --ink: #E4E8EA; --muted: #98A3AB; --line: #2A353E;
  --accent: #74B5AA; --accent-ink: #0D1A18; --accent-soft: #1C302D; --gold: #D4AF66; --gold-soft: #2E2817;
  --lvA: #5FC08B; --lvB: #6BAFD8; --lvC: #E1A64B; --lvD: #8C969C;
  --ok: #5FC08B; --warn: #E1A64B; --bad: #E57373; --grey: #8C969C;
  --iso45: rgba(116,181,170,.18); --iso55: rgba(116,181,170,.06); --commune: #2B363F; --map-bg: #141B21;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171C; --surface: #182027; --sunk: #0D1216; --ink: #E4E8EA; --muted: #98A3AB; --line: #2A353E;
  --accent: #74B5AA; --accent-ink: #0D1A18; --accent-soft: #1C302D; --gold: #D4AF66; --gold-soft: #2E2817;
  --lvA: #5FC08B; --lvB: #6BAFD8; --lvC: #E1A64B; --lvD: #8C969C;
  --ok: #5FC08B; --warn: #E1A64B; --bad: #E57373; --grey: #8C969C;
  --iso45: rgba(116,181,170,.18); --iso55: rgba(116,181,170,.06); --commune: #2B363F; --map-bg: #141B21;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font: 400 1.5rem/1.2 var(--f-display); letter-spacing: .01em; }
h3 { font-size: .95rem; font-weight: 600; }
.eyebrow { font-size: .72rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1280px; margin: 0 auto; padding: 12px 16px 0; display: grid; gap: 8px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand h1 { font: 400 1.6rem/1 var(--f-display); letter-spacing: .02em; }
.brand .sub { color: var(--muted); font-size: .85rem; }
.status { font-size: .8rem; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--grey); }
.dot.on { background: var(--ok); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { border: 0; background: none; padding: 10px 12px; white-space: nowrap; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; font-weight: 500; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.simbar { background: var(--gold-soft); color: var(--ink); border-bottom: 1px solid var(--line); }
.simbar .in { max-width: 1280px; margin: 0 auto; padding: 8px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: .9rem; }

main { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 60px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
section.view { display: grid; gap: 20px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
main > * { min-width: 0; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grid-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.kpis { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.kpi b { font: 500 1.6rem/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi span { font-size: .8rem; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: var(--r); cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 4px; }
.btn[disabled] { opacity: .5; cursor: default; }

/* cartes bien */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; min-width: 0; }
.card .photo { aspect-ratio: 16/7; max-width: 100%; background: var(--sunk); display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 12px; text-decoration: none; color: var(--muted); position: relative; }
.card .photo .type { font: 400 1.05rem var(--f-display); color: var(--ink); }
.card .photo .lien { font-size: .75rem; }
.card .body { padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; min-width: 0; }
.card .titre { font-weight: 600; line-height: 1.3; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.card .titre:hover { color: var(--accent); }
.card .meta { color: var(--muted); font-size: .85rem; }
.card .prix { font: 500 1.05rem var(--f-mono); font-variant-numeric: tabular-nums; }
.card .foot { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ring { width: 54px; height: 54px; display: block; }
.ring text { font: 500 15px var(--f-mono); fill: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; }
.pill.lv-A { color: var(--lvA); border-color: var(--lvA); } .pill.lv-B { color: var(--lvB); border-color: var(--lvB); }
.pill.lv-C { color: var(--lvC); border-color: var(--lvC); } .pill.lv-D { color: var(--lvD); border-color: var(--lvD); }
.voy { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.voy.vert { background: var(--ok); } .voy.orange { background: var(--warn); } .voy.rouge { background: var(--bad); } .voy.gris { background: var(--grey); }
.tag { font-size: .72rem; padding: 1px 7px; border-radius: 3px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.tag.gold { background: var(--gold-soft); color: var(--gold); }
.tag.warn { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
.tel { font-family: var(--f-mono); font-size: .85rem; user-select: all; }

/* tableaux */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
th button { all: unset; cursor: pointer; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--accent-soft); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters > * { max-width: 100%; }
.filters select, .filters input[type=search] { min-width: 0; border: 1px solid var(--line); background: var(--surface); padding: 6px 8px; border-radius: var(--r); max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { white-space: normal; text-align: left; border: 0; background: var(--surface); padding: 6px 10px; cursor: pointer; font-size: .85rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; cursor: pointer; }

/* carte */
.mapwrap { position: relative; background: var(--map-bg); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; touch-action: none; }
.mapwrap svg { display: block; width: 100%; height: min(72vh, 720px); cursor: grab; }
.mapctl { position: absolute; right: 10px; top: 10px; display: grid; gap: 4px; }
.mapctl button { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); cursor: pointer; font-size: 1.1rem; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.maptip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); padding: 6px 8px; border-radius: var(--r); font-size: .8rem; max-width: 240px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }

/* fiche */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,15,20,.4); z-index: 40; }
.sheet { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(860px, 100%); background: var(--bg); border-left: 1px solid var(--line); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; z-index: 2; }
.sheet-head h2 { font-size: 1.25rem; flex: 1; min-width: 0; }
.sheet-body { padding: 16px; display: grid; gap: 16px; }
.cols2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: .9rem; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.subscores { display: grid; gap: 10px; }
.subscores .s { display: grid; grid-template-columns: 170px 1fr 52px; gap: 10px; align-items: center; font-size: .85rem; }
.subscores .s p { grid-column: 1 / -1; margin: -6px 0 0; color: var(--muted); font-size: .8rem; }
@media (max-width: 520px) { .subscores .s { grid-template-columns: 1fr 52px; } .subscores .s .bar { grid-column: 1 / -1; grid-row: 2; } }
.conf { font-size: .68rem; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.conf.fiable { color: var(--ok); border-color: var(--ok); } .conf.estime { color: var(--lvB); border-color: var(--lvB); } .conf.hypothese { color: var(--warn); border-color: var(--warn); }
.formula { font: .78rem var(--f-mono); color: var(--muted); }
.checklist { display: grid; gap: 6px; }
.checklist label { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; }
pre.draft { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; font: .85rem/1.5 var(--f-body); margin: 0; max-height: 360px; overflow: auto; }
textarea, input[type=text], input[type=date], input[type=number] { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 8px; max-width: 100%; }
textarea { width: 100%; min-height: 90px; }
.disclaimer { font-size: .8rem; color: var(--muted); border-left: 2px solid var(--gold); padding-left: 10px; }

/* kanban */
.kanban { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(220px, 1fr)); overflow-x: auto; padding-bottom: 6px; }
.kcol { background: var(--sunk); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: grid; gap: 6px; font-size: .85rem; }
.kcard.late { border-color: var(--warn); }

/* simulateur */
.sliders { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.slider { display: grid; gap: 4px; }
.slider .lab { display: flex; justify-content: space-between; font-size: .88rem; }
.slider input[type=range] { width: 100%; accent-color: var(--accent); }
.params { display: grid; gap: 10px 18px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.params label { display: grid; gap: 3px; font-size: .85rem; }
.params label span { color: var(--muted); }
.params input { width: 100%; }
.empty { padding: 28px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: .88rem; z-index: 60; }
.spark { width: 70px; height: 22px; }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } .card:hover { border-color: var(--accent); } }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="row" style="gap:12px;align-items:baseline">
        <h1>Radar Domaine</h1>
        <span class="sub">Lieux de réception 200 invités · 45 min de la gare de Saint-Pierre-des-Corps</span>
      </div>
      <div class="status"><span class="dot" id="dbdot"></span><span id="dbstatus">Connexion à la base…</span></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
  <div class="simbar" id="simbar" hidden>
    <div class="in"><b>Simulation en cours.</b><span id="simsummary" class="small"></span>
      <button class="btn" id="simsave">Enregistrer comme paramètres</button>
      <button class="btn ghost" id="simreset">Annuler la simulation</button></div>
  </div>
</header>

<main id="main"></main>
<div id="sheetroot"></div>

<script src="engine.js"></script>
<script>
(function () {
'use strict';
var E = window.RadarEngine;
var TABS = [
  ['tableau', 'Tableau de bord'], ['carte', 'Carte'], ['comparatif', 'Comparatif'], ['simulateur', 'Simulateur'],
  ['suivi', 'Suivi'], ['strategies', 'Stratégies'], ['marche', 'Veille marché'], ['parametres', 'Paramètres'], ['journal', 'Journal']
];
var TYPES = { chateau: 'Château', manoir: 'Manoir', gentilhommiere: 'Gentilhommière', maison_maitre: 'Maison de maître', prieure: 'Prieuré', abbaye: 'Abbaye', grange: 'Grange', ferme: 'Ferme', longere: 'Longère', haras: 'Haras', domaine_viticole: 'Domaine viticole', troglodyte: 'Troglodyte', moulin: 'Moulin', salle: 'Salle', ecole: 'Ancienne école', colonie: 'Centre de vacances', hotel_restaurant: 'Hôtel-restaurant', guinguette: 'Guinguette', golf: 'Golf', camping: 'Camping', entrepot: 'Entrepôt', usine: 'Ancienne usine', gare: 'Ancienne gare', chapelle: 'Chapelle', serres: 'Serres', terrain: 'Terrain', lieu_reception_activite: 'Lieu de réception en activité', autre: 'Autre' };
var STATUTS = [['a_contacter', 'À contacter'], ['contacte', 'Contacté'], ['visite', 'Visite'], ['offre', 'Offre'], ['abandonne', 'Abandonné']];
var CACHET_LIB = { pierre: 'Pierre', tuffeau: 'Tuffeau', charpente: 'Charpente apparente', parc: 'Parc', vue: 'Vue', loire: 'Loire', patrimoine: 'Patrimoine', mh: 'Monument historique', cave: 'Caves', chapelle: 'Chapelle', douves: 'Douves', pigeonnier: 'Pigeonnier', dependances: 'Dépendances', piece_eau: 'Pièce d’eau' };
var SOUS_LIB = { cachet: 'Cachet et attractivité', capacite: 'Capacité 200 et configuration', reglementaire: 'Faisabilité réglementaire', financabilite: 'Finançabilité', rentabilite: 'Rentabilité potentielle', localisation: 'Localisation et accès', hebergement: 'Hébergement sur place', negociabilite: 'Négociabilité et timing', upside: 'Potentiel d’upside' };

var S = {
  db: null, biens: {}, suivi: {}, journal: [], marche: {}, paramsSaved: null, sim: null, geo: null,
  tab: 'tableau', fiche: null, loaded: { biens: false },
  comp: { vue: 'radar', q: '', type: '', strat: '', statut: '', tri: 'score', dir: -1, f: { trajet: true, capacite: true, ppri: true, enclave: true, portee: true } },
  map: { vb: null, montrer55: false, concurrents: true }
};
try { var t = localStorage.getItem('rd_tab'); if (t && TABS.some(function (x) { return x[0] === t; })) S.tab = t; } catch (e) {}
if (location.hash && TABS.some(function (x) { return x[0] === location.hash.slice(1); })) S.tab = location.hash.slice(1);

// ---------- utilitaires ----------
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function eur(x) { return x == null || isNaN(x) ? '<span class="muted">à vérifier</span>' : Math.round(x).toLocaleString('fr-FR') + ' €'; }
function k(x) { return x == null || isNaN(x) ? '—' : (Math.round(x / 1000)).toLocaleString('fr-FR') + ' k€'; }
function pct(x, d) { return x == null ? '—' : (x * 100).toFixed(d == null ? 1 : d).replace('.', ',') + ' %'; }
function m2(x) { return x == null ? '<span class="muted">à vérifier</span>' : Math.round(x).toLocaleString('fr-FR') + ' m²'; }
function fdate(d) { if (!d) return '—'; var t = new Date(d); return isNaN(t) ? h(d) : t.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' }); }
function confCls(c) { return c === 'fiable' ? 'fiable' : c === 'estimé' ? 'estime' : 'hypothese'; }
function conf(c) { return '<span class="conf ' + confCls(c) + '">' + h(c) + '</span>'; }
function toast(msg) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2600); }
function copy(text, btn) {
  try { navigator.clipboard.writeText(text).then(function () { toast('Copié'); }, function () { fallback(); }); } catch (e) { fallback(); }
  function fallback() { var pre = btn && btn.parentNode && btn.parentNode.parentNode.querySelector('pre'); if (pre) { var r = document.createRange(); r.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texte sélectionné, copiez-le avec Ctrl+C'); } }
}
function params() { var base = E.merge(E.DEFAULTS, S.paramsSaved || {}); return S.sim ? E.merge(base, S.sim) : base; }

// ---------- calcul ----------
var cache = { key: null, list: [] };
function analyses() {
  var p = params();
  var key = JSON.stringify(p) + '|' + Object.keys(S.biens).length + '|' + S.version;
  if (cache.key === key) return cache.list;
  var list = Object.keys(S.biens).map(function (id) {
    var b = S.biens[id]; var a;
    try { a = E.analyser(b, p); } catch (e) { a = { fin: { ok: false, voyant: { couleur: 'gris', raison: 'Erreur de calcul' } }, score: { total: 0, niveau: 'D', sous: {}, explications: {} }, strat: { scores: {}, recommandee: '—' }, filtres: [] }; }
    return { id: id, b: b, a: a, s: S.suivi[id] || {} };
  });
  cache = { key: key, list: list };
  return list;
}
S.version = 0;
function actifs(x) { return x.b.statut_annonce !== 'vendu' && x.b.statut_annonce !== 'retire'; }
function filtresActifs(x) { return x.a.filtres.filter(function (f) { return S.comp.f[f.code]; }); }
function dansRadar(x) { return actifs(x) && filtresActifs(x).length === 0; }
function horsPortee(x) { return actifs(x) && x.a.filtres.some(function (f) { return f.code === 'portee'; }) && !x.a.filtres.some(function (f) { return f.code === 'trajet'; }); }

// ---------- rendu commun ----------
function ring(score, niveau, size) {

    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" stroke-dasharray="' + (c * v / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +

  if (t.id === 'q') { S.comp.q = t.value; clearTimeout(simTimer); simTimer = setTimeout(function () { render(); var q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250); return; }
  if (t.hasAttribute('data-sim')) {
    S.sim = S.sim || {}; setPath(S.sim, t.getAttribute('data-sim'), parseFloat(t.value)); cache.key = null;
    clearTimeout(simTimer); simTimer = setTimeout(function () { var y = window.scrollY, id = t.id; render(); window.scrollTo(0, y); var el = document.getElementById(id); if (el) el.focus(); }, 120);
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'ftype') { S.comp.type = t.value; render(); }
  else if (t.id === 'fstrat') { S.comp.strat = t.value; render(); }
  else if (t.id === 'fstatut') { S.comp.statut = t.value; render(); }
  else if (t.hasAttribute('data-filtre')) { S.comp.f[t.getAttribute('data-filtre')] = t.checked; render(); }
  else if (t.id === 'voir55') { S.sim = S.sim || {}; S.sim.voirAussi55 = t.checked; cache.key = null; render(); }
  else if (t.id === 'm55') { S.map.montrer55 = t.checked; drawMap(); }
  else if (t.id === 'mconc') { S.map.concurrents = t.checked; drawMap(); }
  else if (t.hasAttribute('data-statut')) { saveSuivi(t.getAttribute('data-statut'), { statut: t.value || null }).then(render); }
  else if (t.hasAttribute('data-chk')) { var c = Object.assign({}, (S.suivi[S.fiche] || {}).checklist || {}); c[t.getAttribute('data-chk')] = t.checked; saveSuivi(S.fiche, { checklist: c }); }
});

// ---------- données ----------
fetch('geo.json').then(function (r) { return r.json(); }).then(function (g) { S.geo = g; if (S.tab === 'carte') render(); }).catch(function () {});
function setStatus(on, txt) { document.getElementById('dbdot').className = 'dot' + (on ? ' on' : ''); document.getElementById('dbstatus').textContent = txt; }
var renderTimer = null;
function schedule() { S.version++; cache.key = null; clearTimeout(renderTimer); renderTimer = setTimeout(function () { var y = window.scrollY; if (document.activeElement && /TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName) && S.fiche) return; render(); window.scrollTo(0, y); }, 80); }
render();
(window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null)).then(function (db) {
  if (!db) { S.db = false; setStatus(false, 'Base indisponible dans cette vue'); render(); return; }
  S.db = db; setStatus(true, 'Base connectée');
  function onErr(e) { setStatus(false, 'Base : ' + (e && e.code || 'erreur')); }
  db.collection('biens').limit(1000).onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); }); S.biens = o; S.loaded.biens = true; setStatus(true, Object.keys(o).length + ' biens dans la base'); schedule(); }, onErr);
  db.collection('suivi').limit(1000).onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); }); S.suivi = o; schedule(); }, onErr);
  db.doc('config/params').onSnapshot(function (d) { S.paramsSaved = d.exists ? d.data() : null; schedule(); }, onErr);
  db.collection('journal').limit(200).onSnapshot(function (snap) { S.journal = snap.docs.map(function (d) { return d.data(); }).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); }); schedule(); }, onErr);
  db.collection('marche').limit(50).onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { o[d.id] = d.data(); }); S.marche = o; schedule(); }, onErr);
});
})();
</script>
