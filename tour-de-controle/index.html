<title>Tour de contrôle enchères</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : bandeau de pilotage en tête, onglets, contenu en grille qui passe à une colonne sur téléphone */
:root{
  --bg:#eef1f3; --panel:#fbfcfc; --ink:#14232b; --muted:#5b6b73; --line:#d5dde1;
  --accent:#0f5e6e; --accent-soft:#d9ecef;
  --ok:#1f7a4a; --ok-soft:#dcefe3; --warn:#a15c00; --warn-soft:#f8ead2; --bad:#b0302a; --bad-soft:#f6dcda;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --panel:#162228; --ink:#e3ecef; --muted:#93a5ad; --line:#2a3a41;
  --accent:#5cc0d1; --accent-soft:#163a42;
  --ok:#5fcf8f; --ok-soft:#173527; --warn:#f0b35a; --warn-soft:#3b2c14; --bad:#f08b84; --bad-soft:#3d1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --panel:#162228; --ink:#e3ecef; --muted:#93a5ad; --line:#2a3a41;
  --accent:#5cc0d1; --accent-soft:#163a42;
  --ok:#5fcf8f; --ok-soft:#173527; --warn:#f0b35a; --warn-soft:#3b2c14; --bad:#f08b84; --bad-soft:#3d1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding:0 16px;padding-block:16px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
header.top .sub{color:var(--muted);font-size:13px}
.status-db{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{font:600 14px var(--f-body);background:none;border:0;color:var(--muted);padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:2px}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .val{font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.grid2>*{min-width:0}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.pill{display:inline-block;font:600 11px var(--f-body);padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--accent-soft);color:var(--accent)} .p-mute{border-color:var(--line);color:var(--muted)}
ul.alerts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.alerts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:4px;background:var(--bg)}
ul.alerts li .sev{width:8px;height:100%;min-height:18px;border-radius:2px}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.info{background:var(--accent)}
.agenda{display:grid;gap:4px}
.ag{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ag .d{font:500 12px var(--f-mono);color:var(--muted)}
.ag .d b{color:var(--ink);font-weight:600}
.funnel{display:grid;gap:4px}
.fn{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.fn .bar{height:14px;background:var(--accent);border-radius:2px;min-width:2px}
.fn .track{background:var(--bg);border-radius:2px}
button.btn{font:600 13px var(--f-body);background:var(--accent);color:var(--panel);border:0;border-radius:4px;padding:7px 12px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lotcard{display:grid;gap:12px}
.decision{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:4px;background:var(--bg)}
.decision .why{flex:1 1 240px;min-width:0}
.ceil{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ceil div{border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.ceil .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ceil .v{font:500 18px var(--f-mono)}
.ceil .reco{border-color:var(--accent);background:var(--accent-soft)}
.check{margin:0;padding-left:18px;display:grid;gap:3px}
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:16px;display:grid;gap:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.form label.wide{grid-column:1/-1}
input,select,textarea{font:14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
textarea{min-height:70px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.tag{font:500 11px var(--f-mono);color:var(--muted)}
.cert{font:600 10px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:3px}
.c-hyp{background:var(--warn-soft);color:var(--warn)} .c-ok{background:var(--ok-soft);color:var(--ok)}
.digest{display:grid;gap:8px}
.digest ol{margin:0;padding-left:20px;display:grid;gap:3px}
.flags{border:2px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px}
.flags.has-bad{border-color:var(--bad);background:var(--bad-soft)}
.flags-head{display:flex;gap:12px;flex-wrap:wrap}
.flags-head>div{display:grid;gap:2px;min-width:0}
.flags .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.occ{padding:8px 12px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.occ b{font-size:17px}.occ-ok b{color:var(--ok)}.occ-bad b{color:var(--bad)}.occ-unk b{color:var(--warn)}
.flags-sum{flex:1 1 220px}
.flag-list{display:flex;flex-wrap:wrap;gap:6px}
.flag{font:600 12px var(--f-body);padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
.f-bad{color:var(--bad);border-color:var(--bad)}.f-ok{color:var(--ok)}.f-unk{color:var(--muted)}
@media (max-width:520px){h1{font-size:22px}.kpi .val{font-size:19px}.ag{grid-template-columns:78px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Carte : fond = contours départementaux embarqués (aucune tuile externe) */
.map-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media (max-width:860px){.map-wrap{grid-template-columns:1fr}}
#map{height:620px;max-height:75vh;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.leaflet-container{background:var(--bg);font:13px var(--f-body)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.leaflet-popup-content{margin:10px 12px;line-height:1.4}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-tooltip.trib{background:transparent;border:0;box-shadow:none;color:var(--muted);font:600 11px var(--f-display);letter-spacing:.04em;text-transform:uppercase;padding:0}
.leaflet-tooltip.trib:before{display:none}
.leaflet-tooltip.dep{background:transparent;border:0;box-shadow:none;color:var(--line);font:700 22px var(--f-display);padding:0}
.leaflet-tooltip.dep:before{display:none}
.maplist{display:grid;gap:6px;align-content:start;max-height:620px;overflow:auto}
.maplist .it{display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}
.maplist .it:hover,.maplist .it:focus-visible{background:var(--accent-soft);outline:none}
.dot{width:12px;height:12px;border-radius:50%;margin-top:3px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.chk{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.chk input{width:auto;margin:0}
@media (max-width:600px){#map{height:440px}}
.tline{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ib{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.ib button{font:600 11px var(--f-body);padding:2px 8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.ib button+button{border-left:1px solid var(--line)}
.ib button:hover{background:var(--accent-soft);color:var(--ink)}
.ib button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

<script>
(function(){
const TRIB_DEP={"Nantes":"44 Loire-Atlantique","Saint-Nazaire":"44 Loire-Atlantique","La Roche-sur-Yon":"85 Vendée","Les Sables-d'Olonne":"85 Vendée","Angers":"49 Maine-et-Loire","Saumur":"49 Maine-et-Loire","Tours":"37 Indre-et-Loire","Blois":"41 Loir-et-Cher"};
const DEPS=["44 Loire-Atlantique","85 Vendée","49 Maine-et-Loire","37 Indre-et-Loire","41 Loir-et-Cher"];
const TRIBUNAUX=["Nantes","Saint-Nazaire","La Roche-sur-Yon","Les Sables-d'Olonne","Angers","Saumur","Tours","Blois"];
const STATUTS={repere:"Repéré",analyse:"Analysé",plafond:"Plafond fixé",enchere:"Enchère mandatée",gagne:"Gagné",perdu:"Non gagné",retire:"Retiré / reporté",revendu:"Revendu",horsjeu:"Écarté"};
const FUNNEL=["repere","analyse","plafond","enchere","gagne","revendu"];
const DEF={cash:50000,financement:0,reserve:5000,fraisFixe:2500,fraisPct:0.10,droitsPct:0.00715,droitsCommun:0.0581,csiPct:0.001,agence:0.05,multCible:2,multConfort:3,margeMin:10000,honoraires:2000,publication:450,autresDefaut:3000,coutTentative:220,cautionMin:3000,cautionPct:0.10,portageMois:250};
const S={lots:[],resultats:[],contacts:[],actions:[],archives:[],veille:[],params:{...DEF},db:null,ro:false,tab:"pilotage",lotSel:null};

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>(v===""||v==null||isNaN(+v))?null:+v;
const eur=v=>v==null||!isFinite(v)?"n.d.":Math.round(v).toLocaleString("fr-FR")+" €";
const keur=v=>v==null||!isFinite(v)?"n.d.":(v/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" k€";
const pct=v=>v==null||!isFinite(v)?"n.d.":Math.round(v*100)+" %";
const x=v=>v==null||!isFinite(v)?"n.d.":"x"+v.toLocaleString("fr-FR",{maximumFractionDigits:2});
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{if(!s)return null;const d=new Date(s);return isNaN(d)?null:d};
const days=d=>d?Math.round((new Date(d).setHours(0,0,0,0)-today())/864e5):null;
// Audience passée sans adjudication pour Florian : masqué, le résultat arrive via la veille
// Lot marqué « pas intéressé » par Florian : masqué comme les audiences passées
const pasInt=l=>l.interet==="non";
const passe=l=>{const d=days(l.audience);return d!=null&&d<0&&!["gagne","revendu"].includes(l.statut)};
const fdate=s=>{const d=pd(s);if(!d)return "n.d.";return d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit"})+(s.length>10&&(d.getHours()||d.getMinutes())?" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"")};
const addDays=(s,n)=>{const d=pd(s);if(!d)return null;d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addMonths=(s,n)=>{const d=pd(s);if(!d)return null;d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const quant=(a,q)=>{if(!a.length)return null;const s=[...a].sort((m,n)=>m-n);const p=(s.length-1)*q,b=Math.floor(p);return s[b]+(s[b+1]!==undefined?(p-b)*(s[b+1]-s[b]):0)};
const list=v=>String(v||"").split(",").map(t=>t.trim()).filter(Boolean);

/* ---------- modèle ---------- */
function ratios(type){
  const all=S.resultats.filter(r=>num(r.map)&&num(r.adjuge)).map(r=>({...r,ratio:+r.adjuge/+r.map}));
  const seg=type?all.filter(r=>r.type===type):[];
  return seg.length>=3?{set:seg,label:"type "+type}:{set:all,label:"tous types"};
}
// Priorité de Florian par TJ (contacts/<id>.rangs = {TJ: n}) ; sans rang = en fin de liste
const rangOf=(c,tj)=>{const r=c.rangs&&c.rangs[tj];return typeof r==="number"?r:999};
const byRang=tj=>(a,b)=>rangOf(a,tj)-rangOf(b,tj)||String(a.nom||"").localeCompare(String(b.nom||""));
function coverage(trib){
  const av=S.contacts.filter(c=>c.role==="avocat"&&c.statut!=="écarté").sort(byRang(trib));
  const ok=av.filter(c=>list(c.tribunaux).includes(trib)&&["mandaté","contact"].includes(c.statut));
  const conf=av.filter(c=>list(c.aConfirmer).includes(trib)||(list(c.tribunaux).includes(trib)&&!["mandaté","contact"].includes(c.statut)));
  if(ok.length)return{level:"ok",names:ok.map(c=>c.nom)};
  if(conf.length)return{level:"warn",names:conf.map(c=>c.nom)};
  return{level:"bad",names:[]};
}
const PM2_SRC=[["prixM2MA","MeilleursAgents (ville et type)"],["prixM2DVF","DVF ventes réelles (commune et type)"],["prixM2Annonces","Annonces comparables"],["prixM2Autre","Autre source"]];
function pm2Sources(L){
  const rows=PM2_SRC.map(([k,n])=>({k,n:k==="prixM2Autre"&&L.prixM2AutreSource?L.prixM2AutreSource:n,v:num(L[k])})).filter(r=>r.v);
  if(rows.length)return{rows,n:rows.length,retenu:Math.min(...rows.map(r=>r.v)),auto:true};
  const v=num(L.prixM2);return{rows:[],n:v?(num(L.prixM2Sources)||1):0,retenu:v,auto:false};
}
function calc(lot,Pover){
  const P={...S.params,...(Pover||{})};
  const L=lot;
  const map=num(L.map),surface=num(L.surface),dec=num(L.decote)??0.3;
  const src=pm2Sources(L);const pm2=src.retenu;
  const k=P.fraisPct+P.droitsPct+P.csiPct;
  const revente=surface&&pm2?surface*pm2*(1-dec)*(P.reventeMult||1):null;
  const travaux=(num(L.travaux)||0)*(P.travauxMult||1);
  const lf=L.tribunal?lawyerFees(L.tribunal):null;
  const honor=lf&&lf.adj!=null?lf.adj:P.honoraires;
  const tentative=lf&&lf.rep!=null?lf.rep:P.coutTentative;
  const autres=honor+P.publication+travaux+(num(L.autresFrais)??P.autresDefaut)+(P.moisSup||0)*P.portageMois;
  const tva=P.tva?0.2:0;
  const cout=p=>p*(1+k+tva)+P.fraisFixe;
  const marge=p=>revente==null?null:revente*(1-P.agence)-cout(p)-autres;
  const kk=1+k+tva;
  const plafMult=revente==null?null:(revente/P.multCible-P.fraisFixe)/kk;
  const plafConf=revente==null?null:(revente/P.multConfort-P.fraisFixe)/kk;
  const plafCash=(P.cash+P.financement-P.reserve-P.fraisFixe-autres)/kk;
  const plafMarge=revente==null?null:(revente*(1-P.agence)-P.fraisFixe-autres-P.margeMin)/kk;
  const equilibre=revente==null?null:(revente*(1-P.agence)-P.fraisFixe-autres)/kk;
  const reco=revente==null?null:Math.max(0,Math.min(plafMult,plafCash,plafMarge));
  const eff=num(L.plafondDecide)??reco;
  const R=ratios(L.type);
  const rs=R.set.map(r=>r.ratio);
  const med=quant(rs,.5);
  const probable=map&&med?map*med:null;
  const pWin=(map&&eff&&rs.length)?rs.filter(r=>r*map<=eff).length/rs.length:null;
  const mEff=eff!=null?marge(eff):null;
  const esper=(pWin!=null&&mEff!=null)?pWin*mEff-(1-pWin)*tentative:null;
  const caution=map?Math.max(P.cautionMin,P.cautionPct*map):P.cautionMin;
  const cov=L.tribunal?coverage(L.tribunal):{level:"bad",names:[]};
  const conf=src.n>=(L.type==="local"?3:2)?"ok":"faible";
  // décision
  let dec2,why,cls;
  const done={gagne:1,perdu:1,retire:1,revendu:1,horsjeu:1};
  if(done[L.statut]){dec2=STATUTS[L.statut];cls=L.statut==="gagne"||L.statut==="revendu"?"p-ok":"p-mute";why=L.statut==="perdu"&&num(L.adjuge)?"Adjugé "+eur(+L.adjuge)+(map?" ("+x(+L.adjuge/map)+" la MAP)":""):"Dossier clos."}
  else if(revente==null){dec2="À creuser";cls="p-warn";why="Valorisation manquante : surface ou prix au m² non renseigné, aucun plafond calculable."}
  else if(reco<(map||0)*0.75){dec2="Hors jeu";cls="p-bad";why="Plafond recommandé "+keur(reco)+" sous la MAP après baisse d'un quart ("+keur(map*0.75)+")."}
  else if(reco<(map||0)){dec2="Tentative plafonnée";cls="p-warn";why="Gagnable seulement en cas de baisse d'un quart, sans autre enchérisseur."}
  else if(pWin==null){dec2="À creuser";cls="p-warn";why="Plafond "+keur(reco)+" mais aucun résultat d'adjudication pour estimer la probabilité de gagner."}
  else if(pWin>=0.5&&mEff>0){dec2="Priorité 1";cls="p-ok";why="Plafond "+keur(eff)+", gagne dans "+pct(pWin)+" des cas observés, marge "+keur(mEff)+"."}
  else if(pWin>=0.2){dec2="Tentative plafonnée";cls="p-info";why="Gagne dans "+pct(pWin)+" des cas observés ("+R.set.length+" résultats). Se présenter avec un plafond ferme."}
  else{dec2="Veille";cls="p-mute";why="Probabilité de gagner "+pct(pWin)+" au plafond "+keur(eff)+" : l'historique adjuge plus haut."}
  return{P,k,lf,honor,tentative,revente,autres,cout,marge,plafMult,plafConf,plafCash,plafMarge,equilibre,reco,eff,R,med,probable,pWin,mEff,esper,caution,cov,conf,dec:dec2,why,cls,map};
}

/* ---------- alertes et agenda ---------- */
function alerts(){
  const out=[];const actifs=S.lots.filter(l=>!["gagne","perdu","retire","revendu","horsjeu"].includes(l.statut));
  actifs.forEach(l=>{
    const c=calc(l),d=days(l.audience);
    if(d!=null&&d>=0&&d<=10&&c.cov.level!=="ok")out.push({s:c.cov.level==="warn"?"warn":"bad",t:`${l.titre} (${l.tribunal}, J-${d}) : ${c.cov.level==="warn"?"avocat à confirmer par écrit pour ce tribunal ("+c.cov.names.join(", ")+")":"aucun avocat pour enchérir au TJ "+l.tribunal}.`,lot:l.id});
    if(d!=null&&d>=0&&d<=14&&c.revente==null)out.push({s:"warn",t:`${l.titre} : audience dans ${d} j et pas de valorisation.`,lot:l.id});
    if(d!=null&&d>=0&&d<=14&&c.revente!=null&&c.conf==="faible")out.push({s:"info",t:`${l.titre} : prix au m² validé par moins de 2 sources, plafond à confiance faible.`,lot:l.id});
  });
  // conflits de cash : lots avec plafond fixé ou enchère dont les audiences sont à moins de 60 j
  const eng=actifs.filter(l=>["plafond","enchere"].includes(l.statut)&&pd(l.audience));
  for(let i=0;i<eng.length;i++)for(let j=i+1;j<eng.length;j++){
    const a=eng[i],b=eng[j];const gap=Math.abs(pd(a.audience)-pd(b.audience))/864e5;
    const need=calc(a).cout(calc(a).eff||0)+calc(b).cout(calc(b).eff||0);
    if(gap<60&&need>S.params.cash+S.params.financement)out.push({s:"bad",t:`Conflit de cash : ${a.titre} et ${b.titre} (${Math.round(gap)} j d'écart). Gagner les deux demanderait ${keur(need)}.`});
    if(gap<1)out.push({s:"warn",t:`Même jour : ${a.titre} et ${b.titre}.`});
  }
  S.actions.filter(a=>!a.fait&&a.echeance&&days(a.echeance)<0).forEach(a=>out.push({s:"warn",t:`Action en retard : ${a.titre} (${fdate(a.echeance)}).`}));
  S.lots.filter(l=>l.statut==="gagne").forEach(l=>{const p=addMonths(l.audience,2);const d=days(p);if(d!=null&&d<=15)out.push({s:"bad",t:`${l.titre} : prix à consigner avant le ${fdate(p)} (J-${d}).`,lot:l.id})});
  const ord={bad:0,warn:1,info:2};return out.sort((a,b)=>ord[a.s]-ord[b.s]);
}
function agenda(n){
  const ev=[];const lim=n??14;
  S.lots.forEach(l=>{
    if(l.audience)ev.push({d:l.audience,t:"Audience",w:`${l.titre} · TJ ${l.tribunal}`,lot:l.id,k:"aud"});
    if(l.visite)ev.push({d:l.visite,t:"Visite",w:l.titre,lot:l.id,k:"vis"});
    if(l.statut==="gagne"){
      ev.push({d:addDays(l.audience,10),t:"Fin surenchère",w:l.titre,lot:l.id});
      ev.push({d:addMonths(l.audience,1),t:"Frais taxés",w:l.titre,lot:l.id});
      ev.push({d:addMonths(l.audience,2),t:"Prix + droits + publication",w:l.titre,lot:l.id});
    }
  });
  S.actions.filter(a=>!a.fait&&a.echeance).forEach(a=>ev.push({d:a.echeance,t:"Action",w:a.titre,k:"act"}));
  return ev.filter(e=>{const d=days(e.d);return d!=null&&d>=0&&d<=lim}).sort((a,b)=>pd(a.d)-pd(b.d));
}
function cashState(){
  const P=S.params;
  const engage=S.lots.filter(l=>l.statut==="gagne").reduce((s,l)=>{const c=calc(l);return s+c.cout(num(l.adjuge)||0)+c.autres},0);
  const cautions=S.lots.filter(l=>l.statut==="enchere"&&days(l.audience)>=0).reduce((s,l)=>s+calc(l).caution,0);
  return{dispo:P.cash+P.financement,engage,cautions,libre:P.cash+P.financement-engage-cautions};
}


/* ---------- carte ---------- */
const TRIB_GEO={"Nantes":[47.232,-1.548],"Saint-Nazaire":[47.28,-2.251],"La Roche-sur-Yon":[46.668,-1.408],"Les Sables-d'Olonne":[46.501,-1.793],"Angers":[47.477,-0.556],"Saumur":[47.267,-0.083],"Tours":[47.398,0.696],"Blois":[47.581,1.306]};
const CLS_TOK={"p-ok":"--ok","p-warn":"--warn","p-bad":"--bad","p-info":"--accent","p-mute":"--muted"};
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mapLots(){return S.lots.filter(l=>(S.mapPasses||!passe(l))&&!pasInt(l)&&(!l.tribunal||TRIB_GEO[l.tribunal])).map(l=>({l,c:calc(l)}))}
function vCarte(){

  rows.sort((a,b)=>(num(b.l.map)||0)-(num(a.l.map)||0)).forEach(({l,c})=>{
    let ll=[+l.lat,+l.lon];const k=ll.join();const n=seen[k]=(seen[k]||0)+1;
    if(n>1){const a=n*2.1;ll=[ll[0]+.012*Math.sin(a)*Math.ceil(n/3),ll[1]+.018*Math.cos(a)*Math.ceil(n/3)]} // même commune : on écarte un peu
    const r=(innerWidth<600?3:5)+Math.min(innerWidth<600?6:9,Math.sqrt((num(l.map)||5000)/1000)*(innerWidth<600?1:1.6));

    S.mapMk[l.id]=mk;pts.push(ll);

  else m.fitBounds([[46.27,-2.6],[48.0,2.25]],{padding:[10,10]});
  m.on("moveend",()=>{S.mapView={c:m.getCenter(),z:m.getZoom()}});

  m.on("popupopen",ev=>{const b=ev.popup.getElement().querySelector("[data-lot]");if(b)b.onclick=()=>{S.lotSel=b.dataset.lot;S.tab="lots";render();window.scrollTo({top:0})}});
  setTimeout(()=>m.invalidateSize(),0);
}

const DOC_TYPES={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",csv:"text/csv",md:"text/markdown",json:"application/json",txt:"text/plain"};

      :`<p class="small muted">${S.ro?"Lecture seule : l'ajout de fichiers est réservé aux éditeurs.":fs.length?"":"Aucun document."}</p>`}

}
async function uploadFiles(lotId,files){
  const msg=$("#upmsg-"+lotId);const say=t=>{const m=$("#upmsg-"+lotId);if(m)m.textContent=t};
  if(!S.assets){say("Ajout impossible dans cette vue.");return}
  const ok=[],ko=[];
  for(const f of files){
    const ext=(f.name.split(".").pop()||"").toLowerCase();const type=DOC_TYPES[ext];
    if(!type){ko.push(f.name+" (format non accepté)");continue}
    say("Envoi de "+f.name+"…");
    try{const r=await S.assets.upload(f,{type});ok.push({id:r.id,nom:f.name,type:r.contentType,taille:r.sizeBytes,date:new Date().toISOString().slice(0,10)})}
    catch(e){ko.push(f.name+" ("+({too_large:"trop lourd",unsupported_type:"format refusé",quota_or_state:"espace plein",rate_limited:"trop d'envois, réessaie plus tard"}[e&&e.code]||"refusé")+")")}
  }
  if(ok.length){const l=S.lots.find(x=>x.id===lotId);const cur=Array.isArray(l&&l.fichiers)?l.fichiers:[];
    try{await S.db.collection("lots").doc(lotId).update({fichiers:[...cur,...ok]})}catch(e){ko.push("enregistrement de la liste refusé")}}
  setTimeout(()=>say((ok.length?ok.length+" fichier"+(ok.length>1?"s":"")+" ajouté"+(ok.length>1?"s":"")+". ":"")+(ko.length?"Non ajouté : "+ko.join(", ")+".":"")),60);
}

function initResizers(){
  document.querySelectorAll("#view table").forEach(t=>{
    if(t.closest(".leaflet-container"))return;
    const ths=t.querySelectorAll("tr:first-child th");if(!ths.length)return;
    const key=tableKey(t);t.dataset.colkey=key;const ws=COLW[key]||{};
    if(Object.keys(ws).length)t.classList.add("fixedcols");
    ths.forEach((th,i)=>{th.dataset.ci=i;if(ws[i]){th.style.width=ws[i]+"px";th.style.minWidth=ws[i]+"px";th.style.maxWidth=ws[i]+"px"}
      if(!th.querySelector(".colgrip")){const g=document.createElement("span");g.className="colgrip";g.title="Glisser pour régler la largeur, double-clic pour revenir à l'automatique";th.appendChild(g)}});
  });

let colDrag=null;
document.addEventListener("pointerdown",e=>{const g=e.target.closest&&e.target.closest(".colgrip");if(!g)return;e.preventDefault();e.stopPropagation();
  const th=g.parentElement,t=th.closest("table");
  // fige toutes les colonnes à leur largeur actuelle avant le premier réglage

  t.classList.add("fixedcols");colDrag={th,t,x:e.clientX,w:th.getBoundingClientRect().width};g.setPointerCapture&&g.setPointerCapture(e.pointerId);document.body.classList.add("colresizing")},true);
document.addEventListener("pointermove",e=>{if(!colDrag)return;const w=Math.max(40,Math.round(colDrag.w+e.clientX-colDrag.x));const th=colDrag.th;th.style.width=th.style.minWidth=th.style.maxWidth=w+"px"});
document.addEventListener("pointerup",e=>{if(!colDrag)return;const {t}=colDrag;const key=t.dataset.colkey;const ws={};
  t.querySelectorAll("tr:first-child th").forEach((x,i)=>{ws[i]=Math.round(x.getBoundingClientRect().width)});COLW[key]=ws;saveColw();colDrag=null;document.body.classList.remove("colresizing")});

const RF=[["rf_inondable","Zone inondable (PPRI, Géorisques)"],["rf_toiture","Toiture ou façade défaillante"],["rf_structure","Structure, fissures, humidité"],["rf_amiante","Amiante ou fibrociment"],["rf_dpe","DPE F/G ou absent"],["rf_elec","Électricité ou gaz dangereux"],["rf_assainissement","Assainissement non conforme"],["rf_servitudes","Servitudes ou urbanisme bloquant"],["rf_copro","Copro en difficulté, travaux votés"],["rf_tva","TVA sur le prix"],["rf_radon","Radon, pollution, termites"]];

}
function vResultats(){

    ${Object.keys(by).length?`<div class="tbl"><table><tr><th>Segment</th><th class="num">n</th><th class="num">Médiane</th><th class="num">P25</th><th class="num">P75</th></tr>${Object.entries(by).map(([k,a])=>`<tr><td>${esc(k)}</td><td class="num">${a.length}</td><td class="num">${x(quant(a,.5))}</td><td class="num">${a.length>=4?x(quant(a,.25)):"n.d."}</td><td class="num">${a.length>=4?x(quant(a,.75)):"n.d."}</td></tr>`).join("")}</table></div>`:empty("Pas encore de segment.")}
  </section></div>
  <section class="panel"><div class="panel-head"><h2>Historique des adjudications</h2>${S.ro?"":`<button class="btn" data-act="add-res">Ajouter un résultat</button>`}</div>
  ${rows.length?`<div class="tbl"><table><tr><th>Date</th><th>Bien</th><th>Tribunal</th><th class="num">MAP</th><th class="num">Adjugé</th><th class="num">Ratio</th><th class="num">€/m²</th><th>Occupation</th><th>Source</th></tr>
  ${rows.map(r=>`<tr class="click" data-res="${esc(r.id)}"><td class="mono">${esc(r.date||"")}</td><td>${esc(r.type||"")} · ${esc(r.commune||"")}${r.surface?` · ${r.surface} m²`:""}</td><td>${esc(r.tribunal||"")}</td><td class="num">${eur(num(r.map))}</td><td class="num">${eur(num(r.adjuge))}</td><td class="num">${x(r.ratio)}</td><td class="num">${eur(r.m2)}</td><td>${esc(r.occupation||"")}</td><td><span class="cert ${r.verifie==="oui"?"c-ok":"c-hyp"}">${r.verifie==="oui"?"vérifié":"à vérifier"}</span> <span class="tag">${esc(r.source||"")}</span></td></tr>`).join("")}</table></div>`:empty("Aucun résultat. Chaque adjudication relevée (Licitor, encheres-publiques, vench) améliore le modèle.")}

}

function feeCell(n,t){
  if(num(n)!=null)return `${eur(+n)}${t?`<div class="tag">${esc(t)}</div>`:""}`;
  return t?`<span class="small">${esc(t)}</span>`:`<span class="tag">à demander</span>`;
}
function lawyerFees(trib){
  const av=S.contacts.filter(c=>c.role==="avocat"&&list(c.tribunaux).includes(trib)&&["mandaté","contact"].includes(c.statut)).sort(byRang(trib));
  const pick=av.find(c=>c.statut==="mandaté"&&num(c.fraisAdjudication)!=null)||av.find(c=>num(c.fraisAdjudication)!=null)||av.find(c=>num(c.fraisRepresentation)!=null);
  return pick?{nom:pick.nom,adj:num(pick.fraisAdjudication),rep:num(pick.fraisRepresentation)}:null;
}
function vReseau(){

  // Annuaire rangé comme la couverture : département, puis TJ ciblé ; le reste dans « Autres »

  const groups={};S.contacts.forEach(c=>{const k=tjOf(c);(groups[k]=groups[k]||[]).push(c)});

  <div class="tbl"><table><tr><th>Département</th><th>Tribunal</th><th>Couverture</th><th>Avocats</th><th>Audiences à venir</th></tr>
  ${trib.map(t=>{const c=coverage(t);const up=S.lots.filter(l=>l.tribunal===t&&days(l.audience)>=0&&!["perdu","retire","horsjeu"].includes(l.statut));return `<tr><td>${esc(TRIB_DEP[t]||"")}</td><td>TJ ${esc(t)}</td><td><span class="pill ${c.level==="ok"?"p-ok":c.level==="warn"?"p-warn":"p-bad"}">${c.level==="ok"?"Couvert":c.level==="warn"?"À confirmer":"Manquant"}</span></td><td>${esc(c.names.join(", ")||"aucun")}</td><td>${up.map(l=>esc(l.titre)+" ("+fdate(l.audience)+")").join("<br>")||"<span class='muted'>aucune</span>"}</td></tr>`}).join("")}</table></div></section>
  <section class="panel"><div class="panel-head"><h2>Annuaire</h2>${S.ro?"":`<button class="btn" data-act="add-contact">Ajouter un contact</button>`}</div>
  ${DEPS.map(d=>`<h3 class="dep-h">${esc(d)}</h3>`+TRIBUNAUX.filter(t=>TRIB_DEP[t]===d).map(g=>{const cs=groups[g]||[];const cv=coverage(g);const avs=cs.filter(c=>c.role==="avocat").sort(byRang(g)),oth=cs.filter(c=>c.role!=="avocat");cs.length=0;cs.push(...avs,...oth);const tj=g;
    return `<h4 class="tj-h">TJ ${esc(g)} <span class="pill ${cv.level==="ok"?"p-ok":cv.level==="warn"?"p-warn":"p-bad"}">${cv.level==="ok"?"Couvert":cv.level==="warn"?"À confirmer":"Manquant"}</span></h4>`+(cs.length?`<div class="tbl"><table data-tjtable="${esc(typeof tj==="string"?tj:"")}"><tr><th class="rkh">Priorité</th><th>Nom</th><th>Rôle</th><th>Téléphone</th><th>Email</th><th>Enchérit au TJ</th><th>Statut</th><th class="num">Frais de représentation</th><th class="num">Frais d'adjudication</th></tr>${cs.map(c=>`<tr class="click" data-contact="${esc(c.id)}"${rkAttrs(c,typeof tj==="string"?tj:"")}>${rkCell(c,typeof tj==="string"?tj:"",avsOf(cs))}<td><b>${esc(c.nom||c.structure)}</b><div class="tag">${esc(c.nom?c.structure||"":"")}</div></td><td>${esc(c.role||"")}</td><td class="mono" style="white-space:nowrap">${esc(c.telephone||"")}</td><td class="mono small">${esc(c.email||"")}</td><td>${esc(list(c.tribunaux).join(", "))}${list(c.aConfirmer).length?`<div><span class="pill p-warn">à confirmer : ${esc(list(c.aConfirmer).join(", "))}</span></div>`:""}</td><td>${esc(c.statut||"")}</td><td class="num">${feeCell(c.fraisRepresentation,c.forfaitTentative)}</td><td class="num">${feeCell(c.fraisAdjudication,c.forfaitAdjudication)}</td></tr>`).join("")}</table></div>`:`<p class="small muted">Aucun contact au barreau de ${esc(g)}.</p>`)}).join("")).join("")}${(()=>{const cs=groups.Autres||[];return cs.length?`<h3 class="dep-h">Hors barreaux (banque, autres)</h3><div class="tbl"><table data-tjtable="${esc(typeof tj==="string"?tj:"")}"><tr><th class="rkh">Priorité</th><th>Nom</th><th>Rôle</th><th>Téléphone</th><th>Email</th><th>Enchérit au TJ</th><th>Statut</th><th class="num">Frais de représentation</th><th class="num">Frais d'adjudication</th></tr>${cs.map(c=>`<tr class="click" data-contact="${esc(c.id)}"${rkAttrs(c,typeof tj==="string"?tj:"")}>${rkCell(c,typeof tj==="string"?tj:"",avsOf(cs))}<td><b>${esc(c.nom||c.structure)}</b><div class="tag">${esc(c.nom?c.structure||"":"")}</div></td><td>${esc(c.role||"")}</td><td class="mono" style="white-space:nowrap">${esc(c.telephone||"")}</td><td class="mono small">${esc(c.email||"")}</td><td>${esc(list(c.tribunaux).join(", "))}${list(c.aConfirmer).length?`<div><span class="pill p-warn">à confirmer : ${esc(list(c.aConfirmer).join(", "))}</span></div>`:""}</td><td>${esc(c.statut||"")}</td><td class="num">${feeCell(c.fraisRepresentation,c.forfaitTentative)}</td><td class="num">${feeCell(c.fraisAdjudication,c.forfaitAdjudication)}</td></tr>`).join("")}</table></div>`:""})()}
  </section></div>`;
}

const PF=[["cash","Cash disponible (€)"],["financement","Financement complémentaire (€)"],["reserve","Réserve d'aléas (€)"],["fraisFixe","Frais taxés : part fixe (€)"],["fraisPct","Frais taxés : % du prix (0,10 = 10 %)"],["droitsPct","Droits marchand de biens (0,00715)"],["droitsCommun","Droits de droit commun (0,0581)"],["csiPct","Contribution sécurité immobilière (0,001)"],["agence","Commission d'agence (0,05)"],["multCible","Multiple cible ferme"],["multConfort","Multiple de confort"],["margeMin","Marge minimale (€)"],["honoraires","Honoraires avocat enchérisseur si adjudication (€)"],["publication","Publication du titre (€)"],["autresDefaut","Serrurier, diag, portage par défaut (€)"],["portageMois","Portage par mois (€)"],["coutTentative","Coût d'une tentative ratée (€)"],["cautionMin","Caution minimale (€)"],["cautionPct","Caution en % de la MAP"]];

/* ---------- formulaires ---------- */
const FIELDS={
  lots:[["titre","Bien"],["ref","Référence"],["adresse","Adresse du bien"],["commune","Commune"],["type","Type","select",["maison","appartement","studio","local","immeuble","terrain","autre"]],["tribunal","Tribunal","select",TRIBUNAUX],["audience","Audience","datetime-local"],["visite","Prochaine visite","datetime-local"],["visitesTxt","Toutes les visites (texte)"],["statut","Statut","select",Object.keys(STATUTS)],["map","Mise à prix (€)","number"],["surface","Surface (m²)","number"],["prixM2MA","Prix m² MeilleursAgents, moyenne (€)","number"],["prixM2MABas","MeilleursAgents, bas de fourchette (€)","number"],["prixM2MAHaut","MeilleursAgents, haut de fourchette (€)","number"],["prixM2MADate","MeilleursAgents, date de l'estimation","date"],["prixM2DVF","Prix m² DVF médiane (€)","number"],["prixM2Annonces","Prix m² annonces comparables (€)","number"],["prixM2Autre","Prix m² autre source (€)","number"],["prixM2AutreSource","Nom de l'autre source"],["prixM2","Prix m² manuel si aucune source (€)","number"],["decote","Décote état et sortie (0,3 = 30 %)","number"],["travaux","Travaux (€)","number"],["autresFrais","Serrurier, diag, portage (€)","number"],["occupation","Occupation","select",["libre","occupé","bail","inconnu"]],...RF.map(([k,n])=>[k,"Red flag : "+n,"select",["inconnu","oui","non"]]),["plafondDecide","Plafond décidé (€)","number"],["predit","Prix prédit (€)","number"],["adjuge","Prix adjugé (€)","number"],["poursuivant","Avocat poursuivant"],["lien","Lien de la fiche"],["notes","Notes","textarea"],["postmortem","Post-mortem","textarea"]],
  resultats:[["date","Date","date"],["tribunal","Tribunal","select",TRIBUNAUX],["commune","Commune"],["type","Type","select",["maison","appartement","studio","local","immeuble","terrain","autre"]],["surface","Surface (m²)","number"],["map","Mise à prix (€)","number"],["adjuge","Prix adjugé (€)","number"],["occupation","Occupation","select",["libre","occupé","bail","inconnu"]],["baisse","Baisse d'un quart","select",["non","oui"]],["surenchere","Surenchère","select",["non","oui"]],["source","Source"],["lien","Lien"],["verifie","Vérifié","select",["non","oui"]],["notes","Notes","textarea"]],
  contacts:[["nom","Nom"],["structure","Cabinet ou étude"],["role","Rôle","select",["avocat","commissaire de justice","avocat poursuivant","banque","comptable","courtier","autre"]],["barreau","Barreau ou ressort"],["tribunaux","Enchérit au TJ (liste, virgules)"],["aConfirmer","TJ à confirmer (liste, virgules)"],["telephone","Téléphone"],["email","Email"],["site","Site"],["adresse","Adresse"],["statut","Statut","select",["mandaté","contact","candidat","repli","écarté","référence"]],["fraisRepresentation","Frais de représentation, TTC (€)","number"],["forfaitTentative","Détail représentation (HT/TTC, source)"],["fraisAdjudication","Frais d'adjudication, TTC (€)","number"],["forfaitAdjudication","Détail adjudication (source)"],["notes","Notes","textarea"]],
  actions:[["titre","Action"],["echeance","Échéance","date"],["qui","Qui"],["lotRef","Lot lié"]]
};
function openForm(col,doc){
  const f=FIELDS[col];const d=doc||{};
  const val=(k,t)=>{let v=d[k]??"";if(t==="datetime-local"&&v&&v.length===10)v+="T09:00";return esc(v)};
  $("#modal-root").innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true"><h2>${doc?"Modifier":"Ajouter"}</h2>
  <form class="form" id="mform">${f.map(([k,l,t,opts])=>`<label class="${t==="textarea"?"wide":""}">${l}${t==="select"?`<select id="f-${k}" name="${k}"><option value=""></option>${opts.map(o=>`<option value="${esc(o)}" ${d[k]===o?"selected":""}>${esc(col==="lots"&&k==="statut"?STATUTS[o]:o)}</option>`).join("")}</select>`:t==="textarea"?`<textarea id="f-${k}" name="${k}">${esc(d[k]??"")}</textarea>`:`<input id="f-${k}" name="${k}" type="${t||"text"}" ${t==="number"?'step="any"':""} value="${val(k,t)}">`}</label>`).join("")}</form>
  <div class="row" style="justify-content:space-between"><div class="row"><button class="btn" data-m="save">Enregistrer</button><button class="btn ghost" data-m="cancel">Annuler</button></div>${doc?`<button class="btn danger" data-m="del">Supprimer</button>`:""}</div><div class="small" id="merr" style="color:var(--bad)"></div></div></div>`;
  const ov=$("#ov");let confirmDel=false;
  ov.addEventListener("click",async e=>{
    const m=e.target.dataset.m;if(e.target===ov||m==="cancel"){$("#modal-root").innerHTML="";return}
    if(m==="del"){if(!confirmDel){confirmDel=true;e.target.textContent="Confirmer la suppression";return}
      try{await S.db.collection(col).doc(doc.id).delete();if(col==="lots"&&S.lotSel===doc.id)S.lotSel=null;$("#modal-root").innerHTML=""}catch(err){$("#merr").textContent="Suppression refusée : "+(err.message||err.code)}}
    if(m==="save"){
      const out={};f.forEach(([k,,t])=>{const el=$("#f-"+k);let v=el.value;if(t==="number")v=v===""?null:+v;out[k]=v===""?null:v});
      if(col==="lots"&&!out.statut)out.statut="repere";
      const id=doc?doc.id:(col==="lots"&&out.ref?String(out.ref).replace(/[^\w-]/g,""):"")||undefined;
      try{const ref=id?S.db.collection(col).doc(id):S.db.collection(col).doc();await ref.set({...(doc?stripId(doc):{}),...out});$("#modal-root").innerHTML="";if(col==="lots"){S.lotSel=ref.id}}
      catch(err){$("#merr").textContent="Enregistrement refusé : "+(err.message||err.code)}
    }
  });
}
const stripId=d=>{const o={...d};delete o.id;return o};

/* ---------- événements ---------- */
document.addEventListener("click",async e=>{
  const tab=e.target.closest("#tabs button");if(tab){S.tab=tab.dataset.tab;try{history.replaceState(null,"","#"+S.tab)}catch(_){}render();return}
  const ib=e.target.closest("[data-int]");if(ib){e.stopPropagation();if(S.ro||!S.db)return;const l=S.lots.find(x=>x.id===ib.dataset.id);if(!l)return;const v=l.interet===ib.dataset.int?null:ib.dataset.int;
    try{await S.db.collection("lots").doc(l.id).update({interet:v})}catch(err){ib.title="Enregistrement refusé : "+(err.message||err.code)}return}
  const lot=e.target.closest("[data-lot]");if(lot&&!e.target.closest("input")){S.lotSel=lot.dataset.lot;S.tab="lots";render();window.scrollTo({top:0});return}
  const res=e.target.closest("[data-res]");if(res&&!S.ro){openForm("resultats",S.resultats.find(r=>r.id===res.dataset.res));return}
  const ct=e.target.closest("[data-contact]");if(ct&&!S.ro){openForm("contacts",S.contacts.find(r=>r.id===ct.dataset.contact));return}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="toggle-pas"){S.showPas=!S.showPas;render();return}
  if(act==="add-lot")openForm("lots");
  if(act==="edit-lot")openForm("lots",S.lots.find(l=>l.id===a.dataset.id));
  if(act==="close-lot"){S.lotSel=null;render()}
  if(act==="add-res")openForm("resultats");
  if(act==="add-contact")openForm("contacts");
  if(act==="add-action")openForm("actions");
  if(act==="save-params"){const o={};PF.forEach(([k])=>{const v=num($("#p-"+k).value);if(v!=null)o[k]=v});try{await S.db.doc("params/global").set(o);$("#psaved").textContent="Enregistré."}catch(err){$("#psaved").textContent="Refusé : "+(err.message||err.code)}}
  if(act==="archive"){const cs=cashState();const act2=S.lots.filter(l=>!["perdu","retire","revendu","horsjeu"].includes(l.statut));const d=today();const id=d.toISOString().slice(0,10);
    try{await S.db.collection("archives").doc(id).set({libre:cs.libre,actifs:act2.length,prio:act2.filter(l=>calc(l).dec==="Priorité 1").length,nres:S.resultats.length,err:errStats().mae});a.textContent="Archivé"}catch(err){a.textContent="Refusé"}}
});
document.addEventListener("change",async e=>{
  if(e.target.dataset.done){const id=e.target.dataset.done;try{await S.db.collection("actions").doc(id).update({fait:true})}catch(_){e.target.checked=false}}
  if(e.target.id==="mapsim"){S.mapSim=e.target.value;render()}
});

/* ---------- démarrage ---------- */
const h=(location.hash||"").slice(1);if(["pilotage","lots","resultats","reseau","parametres"].includes(h))S.tab=h;
render();
(async()=>{
  const db=window.claude?await window.claude.use("db"):null;
  if(!db){$("#dbstatus").textContent="Base non disponible dans cette vue : ouvre la page sur claude.ai, connecté.";S.ro=true;render();return}
  S.db=db;$("#dbstatus").textContent="Base connectée · mise à jour en direct";
  window.claude.use("assets").then(a=>{S.assets=a;render()}).catch(()=>{});
  try{const u=await window.claude.use("user");const w=u?await u.can("data.write"):null;if(w===false){S.ro=true;$("#dbstatus").textContent="Lecture seule"}}catch(_){}
  let t=null;const sched=()=>{clearTimeout(t);t=setTimeout(render,30)};
  const err=e=>{$("#dbstatus").textContent="Base interrompue : recharge la page ("+e.code+")"};
  ["lots","resultats","contacts","actions","archives","veille"].forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));sched()},err));
  db.doc("params/global").onSnapshot(s=>{S.params={...DEF,...(s.exists?s.data():{})};sched()},err);
})();
})();
</script>
