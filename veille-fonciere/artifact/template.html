const DEPS_GEO = JSON.parse(document.getElementById("deps").textContent);
const A = DATA.annonces;

const TYPOS = { loisir: "Loisir", bois: "Bois", agricole: "Agricole", etang: "Étang", constructible: "Constructible", autre: "Autre" };
const SUIVIS = { "": "Statut de suivi…", a_voir: "À voir", contacte: "Contacté", visite: "Visité", offre: "Offre faite", abandon: "Abandonné" };

  figaro: "Figaro Immo", paruvendu: "ParuVendu", greenacres: "Green-Acres", proprietes_rurales: "Propriétés rurales", agorastore: "Agorastore", import: "Import" };
const PRECISIONS = { parcelle: "Parcelle exacte", adresse: "Adresse", approx: "Approximative (quelques centaines de m)", commune: "Centre de la commune" };
const MOTIFS = { prix_plancher: "Prix < 300 € (prix d'appel)", prix_plafond: "Prix > plafond", prix_absent: "Prix absent",
  prix_reel_texte: "Vrai prix dans le texte", viager: "Viager", gff_parts: "Parts de groupement", indivision: "Parts indivises",
  demembrement: "Nue-propriété / usufruit", location: "Location", recherche: "Annonce de recherche", pas_un_terrain: "Pas un terrain",
  surface_hors_bornes: "Surface hors bornes", prix_m2_trop_eleve: "Prix/m² > 15 €", hors_zone: "Hors départements" };
const CITIES = [["Nantes", 47.218, -1.554], ["Angers", 47.478, -0.563], ["Tours", 47.394, 0.685], ["La Roche-sur-Yon", 46.670, -1.426],
  ["Saint-Nazaire", 47.273, -2.214], ["Cholet", 47.060, -0.879], ["Saumur", 47.260, -0.077], ["Les Sables-d'Olonne", 46.497, -1.783]];

const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const tier = (s) => (s ?? 0) >= 65 ? 4 : s >= 50 ? 3 : s >= 35 ? 2 : 1;
const scoreColor = (s) => css(`--s${tier(s)}`);
// Texte lisible sur une pastille : sombre sur les bleus clairs, blanc sur les bleus foncés
const inkOn = (hex) => { const n = parseInt(hex.slice(1), 16); const l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; return l > 0.55 ? "#0d1b2e" : "#ffffff"; };
const zoneVar = (tz) => { tz = (tz || "").toUpperCase(); return tz.startsWith("AU") ? "--z-au" : tz.startsWith("U") ? "--z-u" : tz.startsWith("A") ? "--z-a" : tz.startsWith("N") ? "--z-n" : "--z-x"; };
const nf0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const eur = (v) => v == null ? "—" : `${nf0.format(v)} €`;
const eurm2 = (v) => v == null ? "—" : `${nf2.format(v)} €/m²`;
const surf = (v) => v == null ? "—" : v >= 10000 ? `${nf2.format(v / 10000)} ha` : `${nf0.format(v)} m²`;
const dist = (v) => v == null ? "—" : v >= 9999 ? "> 400 m" : v >= 1000 ? `${nf2.format(v / 1000)} km` : `${nf0.format(v)} m`;
const dfr = (s) => s ? new Date(s).toLocaleDateString("fr-FR") : "—";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Frais d'acquisition (« frais de notaire ») estimés pour un terrain, barèmes 2026.
// Droits de mutation : part départementale 5 % (85, 44, 49 et 37 l'ont relevée en 2025) + taxe communale 1,2 %
// + frais d'assiette 2,37 % de la part départementale. Émoluments proportionnels du notaire (barème réglementé, HT)
// + formalités, plafonnés à 10 % du prix ; débours (cadastre, état hypothécaire…) et contribution de sécurité immobilière.
const DMTO_DEP = { "85": 0.05, "44": 0.05, "49": 0.05, "37": 0.05 };
const TRANCHES = [[6500, 0.0387], [17000, 0.01596], [60000, 0.01064], [Infinity, 0.00799]];
const FORMALITES_TTC = 450, DEBOURS = 350;
function frais(a) {
  if (!a.prix) return null;
  // Honoraires de négociation payés par l'acheteur et connus : l'acte est assis sur le prix hors honoraires
  const h = a.honoraires;
  const p = h?.charge === "acquereur" && h.net ? h.net : a.prix;
  const dep = DMTO_DEP[a.departement] ?? 0.045;
  const dmto = p * (dep * 1.0237 + 0.012);
  let reste = p, bas = 0, prop = 0;
  for (const [haut, taux] of TRANCHES) { const part = Math.min(reste, haut - bas); if (part <= 0) break; prop += part * taux; reste -= part; bas = haut; }
  const emol = Math.min(prop * 1.2 + FORMALITES_TTC, Math.max(90, p * 0.10));
  const csi = Math.max(15, p * 0.001);
  const total = dmto + emol + DEBOURS + csi;
  return { total, dmto, emol, debours: DEBOURS, csi, taux: total / a.prix, tauxDep: dep, base: p };
}
// Honoraires de négociation (agence ou notaire), en % du prix hors honoraires
const negoCell = (a) => { const h = a.honoraires; if (!h) return "—"; if (h.pct != null) return `${nf0.format(h.pct)} %`; return h.charge === "vendeur" ? '<span class="small">vendeur, montant non publié</span>' : "—"; };
const negoTitle = (a) => { const h = a.honoraires; if (!h) return "Non précisé dans l'annonce"; if (h.pct != null) return `${eur(h.montant)} d'honoraires sur ${eur(h.net)} pour le vendeur, à la charge de ${h.charge === "vendeur" ? "du vendeur" : "l'acheteur"}`; return `Honoraires payés par le vendeur, déjà inclus dans le prix ; l'annonce ne donne pas leur montant.${h.bareme ? " " + h.bareme + " (plafond : le montant réel est fixé au mandat)." : ""}`; };
// Zone PLU : celle du point quand la position est fiable, sinon celle que cite l'annonce ; drapeau si inondable
const alerte = (a, code) => (a.alertes || []).find((x) => x.code === code);
function zoneCell(a) {
  const u = a.urbanisme || {};
  const za = alerte(a, "zone_annoncee")?.zone;
  const flood = alerte(a, "inondable") || alerte(a, "zone_rouge");
  const tag = flood ? ' <span class="small" title="Zone inondable signalée">· inondable</span>' : "";
  if (a.precision_geo !== "commune") return `<span class="zone"><i style="background:var(${zoneVar(u.type_zone)})"></i>${esc(u.zone_plu || u.type_zone || "—")}</span>${tag}`;
  if (za) return `<span class="zone" title="Zone citée par l'annonce"><i style="background:var(${zoneVar(za)})"></i>${esc(za)} (annonce)</span>${tag}`;
  return `<span class="zone" title="Position connue à la commune seulement"><i style="background:var(--z-x)"></i>?</span>${tag}`;
}
const ratio = (a) => a.prix_m2 && a.dvf?.mediane_m2 ? a.prix_m2 / a.dvf.mediane_m2 : null;
const dUAU = (a) => Math.min(a.urbanisme?.dist_zone_u_m ?? 1e9, a.urbanisme?.dist_zone_au_m ?? 1e9);

// ---- Notes : base de l'artefact si disponible, sinon ce navigateur ----
const notes = {};
let db = null;
const docId = (id) => id.replace(/[^A-Za-z0-9_-]/g, "_");
try { Object.assign(notes, JSON.parse(localStorage.getItem("vf-notes") || "{}")); } catch (e) {}
const note = (id) => notes[id] || { texte: "", suivi: "", favori: false, adresse: "" };
async function saveNote(id, patch) {
  notes[id] = { ...note(id), ...patch, id, maj_le: new Date().toISOString() };
  try { localStorage.setItem("vf-notes", JSON.stringify(notes)); } catch (e) {}
  if (db) { try { await db.collection("notes").doc(docId(id)).set(notes[id]); return "base"; } catch (e) { return "navigateur"; } }
  return "navigateur";
}

      (!S.sources.length || S.sources.includes(a.source)) && (n(S.prixMax) == null || a.prix <= n(S.prixMax)) &&
      (n(S.surfMin) == null || (a.surface_m2 || 0) >= n(S.surfMin)) && (n(S.pm2Max) == null || (a.prix_m2 != null && a.prix_m2 <= n(S.pm2Max))) &&
      (a.score ?? 0) >= S.scoreMin && (!S.conf || a.confiance === S.conf) && (!S.fav || nt.favori) &&

// ---- Carte (Leaflet, fond vectoriel : départements, villes) ----
let map = null, layer = null;
function initMap() {
  if (map || typeof L === "undefined") return;
  map = L.map("map", { zoomControl: true, attributionControl: false, zoomSnap: 0.25 }).setView([47.05, -0.75], 7.6);
  const fc = { type: "FeatureCollection", features: DEPS_GEO.map((d) => ({ type: "Feature", properties: { c: d.c, n: d.n }, geometry: d.g })) };
  L.geoJSON(fc, {
    style: (f) => ({ color: css("--dep-line"), weight: DEPS[f.properties.c] ? 1.4 : 0.7, fillColor: DEPS[f.properties.c] ? css("--land-focus") : css("--land"), fillOpacity: 1 }),
    onEachFeature: (f, l) => { if (DEPS[f.properties.c]) l.bindTooltip(`${f.properties.n} (${f.properties.c})`, { permanent: true, direction: "center", className: "dep-label", opacity: .9 }); },
    interactive: false,
  }).addTo(map);
  for (const [n, la, lo] of CITIES) {
    L.circleMarker([la, lo], { radius: 2.5, color: css("--muted"), weight: 0, fillColor: css("--muted"), fillOpacity: 1, interactive: false })
      .bindTooltip(n, { permanent: true, direction: "right", offset: [4, 0], className: "city-label" }).addTo(map);
  }
  layer = L.layerGroup().addTo(map);
  const zone = L.geoJSON({ type: "FeatureCollection", features: fc.features.filter((f) => DEPS[f.properties.c]) });
  map.fitBounds(zone.getBounds(), { padding: [12, 12] });
  document.getElementById("legend").innerHTML = `<b>Score d'opportunité</b>` +
    [["--s4", "≥ 65"], ["--s3", "50 – 65"], ["--s2", "35 – 50"], ["--s1", "< 35"]].map(([v, l]) => `<div><span class="dot" style="background:var(${v})"></span>${l}</div>`).join("") +
    `<div><span class="dot approx"></span>Centre de commune</div>`;
}
function renderMap(v) {
  initMap();
  if (!map) { document.getElementById("map").innerHTML = `<p class="empty">La carte n'a pas pu se charger. La liste reste utilisable.</p>`; return; }
  layer.clearLayers();
  const pts = v.filter((a) => a.lat != null).sort((a, b) => (a.score ?? 0) - (b.score ?? 0));
  for (const a of pts) {
    const approx = a.precision_geo === "commune", on = a.id === S.sel;
    L.circleMarker([a.lat, a.lon], { radius: on ? 11 : 7.5, color: on ? css("--focus") : css("--ring"), weight: on ? 3 : 2,
      fillColor: scoreColor(a.score), fillOpacity: approx ? 0.4 : 0.95, dashArray: approx ? "3 3" : null })
      .bindTooltip(`<b>${esc(a.commune)}</b> · score ${a.score ?? "—"}<br>${eur(a.prix)} · ${surf(a.surface_m2)} · ${TYPOS[a.typologie] || ""}`, { direction: "top", offset: [0, -6] })
      .on("click", () => select(a.id)).addTo(layer);
  }
  setTimeout(() => map.invalidateSize(), 0);
}

  if (!a || S.vue === "exclues") { el.hidden = true; return; }
  el.hidden = false;
  const u = a.urbanisme || {}, env = a.environnement || {}, d = a.dvf || {}, nt = note(a.id), r = ratio(a);
  const bars = [["s_decote", "Décote vs DVF", 30], ["s_mutation", "Potentiel de mutation PLU", 35], ["s_acces", "Accessibilité & usage", 20], ["s_rarete", "Rareté / emplacement", 15]];
  const baisse = a.prix_initial && a.prix < a.prix_initial;
  el.innerHTML = `
    <div class="fiche-head">
      <div style="flex:1;min-width:0"><div class="eyebrow">${SOURCES[a.source] || a.source} · ${TYPOS[a.typologie] || ""} · ${DEPS[a.departement] || a.departement}</div>
      <h2>${esc(a.commune)}, ${surf(a.surface_m2)}</h2></div>
      <button class="star" style="font-size:22px" data-fstar aria-pressed="${nt.favori}" aria-label="Favori">★</button>
      <button class="close" data-close aria-label="Fermer la fiche">×</button>
    </div>
    ${contactBlock(a, nt)}
    <div class="headline">
      <div><div class="price num">${eur(a.prix)}</div><div class="small num">${eurm2(a.prix_m2)}${baisse ? ` · baisse depuis ${eur(a.prix_initial)}` : ""}</div></div>
      <div class="score"><b class="num" style="color:${scoreColor(a.score)}">${a.score ?? "—"}</b><div class="small">/ 100 · confiance ${a.confiance || "—"}</div></div>
    </div>
    ${(() => { const f = frais(a); return f ? `<div class="sec" style="border-top:0;padding-top:0"><h3>Coût d'acquisition estimé</h3>${kv([
      ["Prix affiché", eur(a.prix)],
      a.honoraires?.pct != null ? [`dont honoraires de négociation (${nf0.format(a.honoraires.pct)} % du net vendeur)`, eur(a.honoraires.montant)] : a.honoraires?.charge === "vendeur" ? ["Honoraires de négociation", `payés par le vendeur, inclus dans le prix, montant non publié${a.honoraires.bareme ? `<br><span class="small">${esc(a.honoraires.bareme)} : plafond, le montant réel est fixé au mandat. Demandez-le à l'agent : c'est votre marge de négociation.</span>` : ""}`] : null,
      [`Droits de mutation (${nf2.format((f.tauxDep * 1.0237 + 0.012) * 100)} %, dép. ${a.departement})`, eur(f.dmto)],
      ["Émoluments et formalités du notaire", eur(f.emol)],
      ["Débours et sécurité immobilière", eur(f.debours + f.csi)],
      ["<b>Total à prévoir</b>", `<b>${eur(a.prix + f.total)}</b> (frais ${Math.round(f.taux * 100)} %)`]])}
      <p class="small">Estimation : sur un petit prix, les frais fixes pèsent lourd. Le notaire donne le montant exact.${a.source === "notaires" ? " Le prix affiché inclut déjà ses honoraires de négociation." : ""}</p></div>` : ""; })()}
    <a class="cta" href="${esc(a.url)}" target="_blank" rel="noopener">Voir l'annonce source ↗</a>
    ${a.mode_vente !== "gre_a_gre" ? `<p class="small">Mode de vente : ${a.mode_vente === "encheres" ? "enchères" : "vente interactive (enchères en ligne)"}</p>` : ""}
    <div class="sec"><h3>Décomposition du score</h3>
      ${bars.map(([k, l, m]) => `<div class="bar"><span>${l}</span><span class="num">${a[k] ?? 0} / ${m}</span><div class="track"><div class="fill" style="width:${((a[k] ?? 0) / m) * 100}%;background:${scoreColor(a.score)}"></div></div></div>`).join("")}
      <ul class="why">${(a.explications || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    </div>
    ${a.alertes?.length ? `<div class="sec"><h3>Relevé dans l'annonce</h3><div class="tags">${a.alertes.map((x) => `<span class="tag">${esc(x.libelle)}</span>`).join("")}</div></div>` : ""}
    <div class="sec"><h3>Urbanisme</h3>
      ${a.precision_geo === "commune" ? `<div class="hint">Position connue à la commune seulement : le zonage et les distances ne sont pas fiables. Une fois la parcelle trouvée (photos, Géoportail, vendeur), lancez <span class="mono">python -m vf localiser "${esc(a.id)}" &lt;IDU&gt;</span>.</div>` : ""}
      ${kv([["Localisation", PRECISIONS[a.precision_geo] || a.precision_geo],
        [a.precision_geo === "approx" ? "Parcelle au point approché" : "Parcelle", u.parcelle_idu ? `<span class="mono">${esc(u.parcelle_idu)}</span>` : a.ref_cadastrale ? `<span class="mono">${esc(a.ref_cadastrale)}</span>` : null],
        u.contenance_m2 ? ["Contenance cadastrale", surf(u.contenance_m2)] : null,
        ["Zone", u.zone_plu || u.type_zone ? `<span class="zone"><i style="background:var(${zoneVar(u.type_zone)})"></i>${esc(u.zone_plu || u.type_zone)}${u.doc_urbanisme ? ` · ${esc(u.doc_urbanisme)}` : ""}</span>` : null],
        ["Zone U la plus proche", dist(u.dist_zone_u_m)], ["Zone AU la plus proche", dist(u.dist_zone_au_m)],
        ["OAP à proximité", u.oap_proche_m != null ? dist(u.oap_proche_m) : "aucune à moins de 600 m"],
        u.prescriptions?.length ? ["Prescriptions", esc(u.prescriptions.join(", "))] : null,
        u.servitudes?.length ? ["Servitudes", esc(u.servitudes.join(", "))] : null])}
    </div>
    <div class="sec"><h3>Risques et environnement</h3>
      ${kv([["Natura 2000", yn(env.natura2000)], ["ZNIEFF", yn(env.znieff)],
        ["PPR inondation (commune)", env.ppr_inondation?.length ? esc(env.ppr_inondation.join(", ")) : "Aucun"],
        env.azi?.length ? ["Atlas des zones inondables", esc(env.azi.join(", "))] : null,
        env.risques_commune?.length ? ["Risques recensés", esc([...new Set(env.risques_commune)].slice(0, 6).join(", "))] : null,
        ["Route publique", env.dist_route_m != null ? `${dist(env.dist_route_m)}${env.nature_route ? ` (${esc(env.nature_route.toLowerCase())})` : ""}` : null],
        env.dist_littoral_km != null ? ["Littoral", `${nf0.format(env.dist_littoral_km)} km`] : null,
        ["Agglomération", env.agglo_proche ? `${esc(env.agglo_proche)} à ${nf0.format(env.dist_agglo_km)} km` : null]])}
    </div>
    <div class="sec"><h3>Ventes réelles comparables (DVF)</h3>
      ${kv([["Référence", { section: "même section cadastrale", commune: "commune", departement: "département", repere_regional: "repère régional" }[d.niveau] || "—"],
        ["Ventes retenues", d.n], ["€/m² p25 · médiane · p75", d.mediane_m2 != null ? `${nf2.format(d.p25_m2)} · <b>${nf2.format(d.mediane_m2)}</b> · ${nf2.format(d.p75_m2)}` : null],
        ["Ce terrain", r != null ? `${Math.round(r * 100)} % de la médiane` : null]])}
      ${d.ventes?.length ? `<div class="dvf"><table><thead><tr><th>Date</th><th class="r">Prix</th><th class="r">Surface</th><th class="r">€/m²</th><th>Nature</th></tr></thead><tbody>${
        d.ventes.slice(0, 8).map((x) => `<tr><td>${dfr(x.date)}</td><td class="r num">${eur(x.valeur)}</td><td class="r num">${surf(x.surface_m2)}</td><td class="r num">${nf2.format(x.prix_m2)}</td><td>${esc(x.nature)}${x.section ? ` <span class="mono">${esc(x.section)}</span>` : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}
    </div>
    ${a.historique_prix?.length > 1 ? `<div class="sec"><h3>Historique du prix</h3>${kv(a.historique_prix.map((h) => [dfr(h.date), eur(h.prix)]))}</div>` : ""}
    <div class="sec"><h3>Note personnelle</h3>
      <select class="sel" id="n-suivi" aria-label="Statut de suivi">${Object.entries(SUIVIS).map(([k, l]) => `<option value="${k}" ${nt.suivi === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      <textarea id="n-texte" placeholder="Appel mairie, visite, avis du voisin, prix négocié…">${esc(nt.texte)}</textarea>
      <div class="note-row"><button class="btn" id="n-save">Enregistrer la note</button><span class="small" id="n-etat">${nt.maj_le ? `Modifiée le ${dfr(nt.maj_le)}` : ""}</span></div>
    </div>
    <div class="sec"><h3>Vérifier sur les sites officiels</h3><div class="links">${links(a).map(([l, h]) => `<a href="${esc(h)}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div></div>
    <div class="sec"><h3>Texte de l'annonce</h3><p class="desc">${esc((a.description || "").replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, ""))}</p>
      <p class="small">Vue pour la première fois le ${dfr(a.premiere_vue)} · publiée le ${dfr(a.date_publication)}</p></div>`;
  el.scrollTop = 0;
}
document.getElementById("fiche").addEventListener("click", async (e) => {
  if (e.target.closest("[data-close]")) { S.sel = null; return render(); }
  if (e.target.closest("[data-fstar]")) { await saveNote(S.sel, { favori: !note(S.sel).favori }); return render(); }
  const cp = e.target.closest("[data-copy]");
  if (cp) {
    try { await navigator.clipboard.writeText(cp.dataset.copy); cp.textContent = "Copié"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(cp.previousElementSibling || cp); getSelection().removeAllRanges(); getSelection().addRange(r); cp.textContent = "Sélectionné"; }
    return;
  }
  if (e.target.id === "n-adresse-save") {
    const where = await saveNote(S.sel, { adresse: document.getElementById("n-adresse").value.trim() });
    renderFiche();
    if (where !== "base") document.getElementById("n-adresse-etat").textContent = "Enregistrée dans ce navigateur seulement (base de la page indisponible).";
    return;
  }
  if (e.target.id === "n-save") {
    const where = await saveNote(S.sel, { texte: document.getElementById("n-texte").value });
    document.getElementById("n-etat").textContent = where === "base" ? "Enregistrée" : "Enregistrée dans ce navigateur";
    renderList(visibles());
  }
});
document.getElementById("fiche").addEventListener("change", async (e) => {
  if (e.target.id === "n-suivi") { await saveNote(S.sel, { suivi: e.target.value }); renderList(visibles()); renderHeader(visibles()); }
});

document.getElementById("f-toggle").addEventListener("click", (e) => {
  const open = document.getElementById("filters").classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", open);
});

// ---- Navigation ----
function select(id) {
  S.sel = id; render();
  const a = A.find((x) => x.id === id);
  if (map && a?.lat != null && S.vue === "carte") map.flyTo([a.lat, a.lon], Math.max(map.getZoom(), 10), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.6 });
}
for (const k of ["carte", "tableau", "exclues"]) document.getElementById(`tab-${k}`).addEventListener("click", () => {
  S.vue = k; try { localStorage.setItem("vf-vue", k); } catch (e) {} render();
});
function render() {
  const v = visibles();
  renderHeader(v);
  if (S.vue === "carte") { renderMap(v); renderList(v); }
  if (S.vue === "tableau") renderTable(v);
  if (S.vue === "exclues") renderExclues();
  renderFiche();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (map) { map.remove(); map = null; } render(); });
new MutationObserver(() => { if (map) { map.remove(); map = null; } render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

renderFilters();
if (A.length && !matchMedia("(max-width: 860px)").matches) S.sel = [...A].sort((a, b) => (b.score ?? 0) - (a.score ?? 0))[0].id;
render();

// Notes partagées : chargées depuis la base de l'artefact quand elle répond
(async () => {
  try {
    db = window.claude?.use ? await window.claude.use("db") : null;
    if (!db) return;
    db.collection("notes").onSnapshot((snap) => {
      for (const doc of snap.docs) { const x = doc.data(); if (x?.id) notes[x.id] = x; }
      const editing = ["n-texte", "n-adresse"].includes(document.activeElement?.id);
      renderHeader(visibles());
      if (S.vue === "carte") renderList(visibles()); else if (S.vue === "tableau") renderTable(visibles());
      if (!editing) renderFiche();
    }, () => {});
  } catch (e) { db = null; }
})();
})();
</script>
